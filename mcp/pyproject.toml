[project]
name = "investment-wizard-mcp"
version = "0.1.0"
description = "FastMCP server exposing investment-wizard market research data to LLM agents"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
investment-wizard-mcp = "investment_wizard_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
